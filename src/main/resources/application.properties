spring.application.name=demo

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/task_tracker_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:task_tracker_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:task_tracker_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto
server.port=${PORT:8083}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=task_tracker.demo.controller

# Errores
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never