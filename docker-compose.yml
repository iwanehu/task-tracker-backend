services:

  postgres:
    image: postgres:17-alpine
    container_name: task_tracker_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: task_tracker_db
      POSTGRES_USER: task_tracker_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - task_tracker_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_tracker_user -d task_tracker_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - task_tracker_network


  backend:
    build: .
    container_name: task_tracker_api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8083:8083"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_tracker_db
      SPRING_DATASOURCE_USERNAME: task_tracker_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: 8083

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - task_tracker_network


volumes:
  task_tracker_postgres_data:


networks:
  task_tracker_network:
    driver: bridge